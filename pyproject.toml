[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "showdown-sdk"
version = "0.1.0"
description = "SDK for building Pokémon Showdown bots in Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "websockets>=16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["python_showdown"]
